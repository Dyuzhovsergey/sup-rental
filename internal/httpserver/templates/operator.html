<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <a class="skip-link" href="#main-content">К содержимому</a>

    <div class="app-shell">
        {{template "equipment-sidebar" .}}

        <main class="main-content" id="main-content" tabindex="-1">
            <div class="content-container">
                <header class="page-header">
                    <div>
                        <p class="page-eyebrow">Ежедневная работа</p>
                        <h1>Рабочее место оператора</h1>
                        <p class="page-description">
                            Просматривайте инвентарь перед оформлением будущих аренд.
                        </p>
                    </div>
                </header>

                <section class="panel operator-entry-panel" aria-labelledby="operator-equipment-heading">
                    <div class="panel-body operator-entry">
                        <span class="operator-entry__icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24" fill="none">
                                <path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"></path>
                                <path d="m4 12 8 4.5 8-4.5"></path>
                                <path d="m4 16.5 8 4.5 8-4.5"></path>
                            </svg>
                        </span>
                        <div class="operator-entry__copy">
                            <h2 id="operator-equipment-heading">Оборудование</h2>
                            <p>
                                Откройте список оборудования в режиме просмотра.
                                Изменение инвентаря доступно только администратору.
                            </p>
                        </div>
                        <a class="button button--primary" href="/equipment">
                            Открыть список
                            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="m9 18 6-6-6-6"></path>
                            </svg>
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
