<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <main class="login-page" id="main-content">
        <section class="login-panel" aria-labelledby="login-heading">
            <header class="login-header">
                <span class="brand-mark login-brand-mark" aria-hidden="true">
                    <svg class="icon icon--brand" viewBox="0 0 24 24" fill="none">
                        <path d="M4 8.5c2.7-2.3 5.4-2.3 8 0s5.3 2.3 8 0"></path>
                        <path d="M4 13c2.7-2.3 5.4-2.3 8 0s5.3 2.3 8 0"></path>
                        <path d="M4 17.5c2.7-2.3 5.4-2.3 8 0s5.3 2.3 8 0"></path>
                    </svg>
                </span>
                <p class="login-product">SUP Rental</p>
                <h1 id="login-heading">Вход в систему</h1>
                <p>Используйте учётную запись администратора или оператора проката.</p>
            </header>

            {{if .LoggedOut}}
            <div class="alert alert--success login-alert" role="status">
                Сеанс завершён.
            </div>
            {{end}}

            {{if .Error}}
            <div class="alert alert--danger login-alert" id="login-error" role="alert">
                {{.Error}}
            </div>
            {{end}}

            <form class="login-form" method="post" action="/login"{{if .Error}} aria-describedby="login-error"{{end}}>
                <div class="field">
                    <label class="field-label" for="login">Логин</label>
                    <input
                        id="login"
                        name="login"
                        type="text"
                        value="{{.Login}}"
                        autocomplete="username"
                        maxlength="32"
                        required
                        autofocus
                    >
                </div>

                <div class="field">
                    <label class="field-label" for="password">Пароль</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        maxlength="128"
                        required
                    >
                </div>

                <button class="button button--primary login-submit" type="submit">
                    Войти
                </button>
            </form>
        </section>
    </main>
</body>
</html>
